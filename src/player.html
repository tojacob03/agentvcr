<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --bg: #0d0d0f;
  --surface: #151518;
  --surface-2: #1c1c21;
  --border: #26262d;
  --text: #e8e8eb;
  --muted: #8d8d98;
  --faint: #5c5c66;
  --rec: #ff4a3d;
  --add: #3fb950;
  --add-bg: rgba(63, 185, 80, 0.12);
  --del: #f26d5f;
  --del-bg: rgba(242, 109, 95, 0.12);
  --link: #8ab4ff;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fbfaf8;
    --surface: #ffffff;
    --surface-2: #f3f2ef;
    --border: #e4e2dd;
    --text: #1b1b1f;
    --muted: #6b6b75;
    --faint: #a3a3ab;
    --rec: #e5352a;
    --add: #1a7f37;
    --add-bg: rgba(26, 127, 55, 0.1);
    --del: #c93c2f;
    --del-bg: rgba(201, 60, 47, 0.09);
    --link: #2557c7;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.6 var(--sans);
  padding-bottom: 120px;
}
a { color: var(--link); }
.wrap { max-width: 860px; margin: 0 auto; padding: 0 20px; }

/* Header card */
.top { display: flex; align-items: center; gap: 10px; padding: 22px 0 0; color: var(--muted); font: 12px/1 var(--mono); letter-spacing: 0.04em; }
.top a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.top a:hover { color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 0 3px color-mix(in srgb, var(--rec) 22%, transparent); }
body.playing .dot { animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.poster { padding: 44px 0 30px; border-bottom: 1px solid var(--border); margin-bottom: 30px; }
.agent { display: inline-flex; gap: 8px; align-items: center; font: 12px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.agent b { color: var(--text); font-weight: 600; }
h1 { font-size: clamp(26px, 4.4vw, 40px); line-height: 1.12; letter-spacing: -0.02em; margin: 14px 0 18px; font-weight: 650; text-wrap: balance; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 16px; }
.meta span { white-space: nowrap; }
.stats { display: flex; flex-wrap: wrap; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 26px; }
.stat { background: var(--surface); padding: 14px 16px; flex: 1 1 110px; }
.stat b { display: block; font: 600 22px/1.1 var(--mono); letter-spacing: -0.02em; }
.stat span { color: var(--muted); font-size: 12px; }
.stat .plus { color: var(--add); }
.stat .minus { color: var(--del); }
.start { margin-top: 26px; display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font: 600 14px/1 var(--sans); border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 11px 18px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn:focus-visible, .ctl:focus-visible, .tool-head:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* Feed */
.ev { position: relative; margin: 0 0 18px; }
.ev[hidden] { display: none; }
.ev .anchor { position: absolute; left: -44px; top: 2px; width: 36px; text-align: right; font: 11px/1.6 var(--mono); color: var(--faint); text-decoration: none; opacity: 0; }
.ev:hover .anchor { opacity: 1; }
.prompt { margin-top: 34px; padding: 14px 16px 14px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.prompt .who { font: 11px/1 var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
.prompt .body { white-space: pre-wrap; word-wrap: break-word; font-size: 16px; }
.caret::after { content: ""; display: inline-block; width: 8px; height: 1.1em; margin-left: 1px; vertical-align: -2px; background: var(--rec); animation: blink 1s steps(2, start) infinite; }
.reveal { overflow: hidden; }
.reveal.partial { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent); }
.text { word-wrap: break-word; }
.text > :first-child { margin-top: 0; }
.text > :last-child { margin-bottom: 0; }
.text p, .text ul, .text ol, .text pre, .text table, .text blockquote { margin: 0 0 12px; }
.text h3, .text h4, .text h5 { margin: 18px 0 8px; font-size: 15px; }
.text ul, .text ol { padding-left: 22px; }
.text li { margin: 3px 0; }
.text code { font: 13px/1.5 var(--mono); background: var(--surface-2); border-radius: 4px; padding: 1px 5px; }
.text pre { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
.text pre code { background: none; padding: 0; }
.text blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--muted); }
.text table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; }
.text th, .text td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
.text th { background: var(--surface); }
.thinking { color: var(--muted); font-style: italic; border-left: 2px solid var(--border); padding-left: 12px; font-size: 14px; white-space: pre-wrap; }
.note { text-align: center; font: 12px/1 var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: 0.08em; }

/* Tools */
.tool { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 13px; }
.tool-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; user-select: none; min-height: 36px; border-radius: 8px; }
.tool-head:hover { background: var(--surface-2); }
.kind { font: 600 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); flex: none; width: 52px; }
.tool-title { font-family: var(--mono); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.status { flex: none; font: 12px/1 var(--mono); color: var(--faint); }
.status.ok { color: var(--add); }
.status.err { color: var(--del); }
.status.run::before { content: ""; display: inline-block; width: 10px; height: 10px; border: 2px solid var(--faint); border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.counts { flex: none; font: 12px/1 var(--mono); }
.counts .plus { color: var(--add); }
.counts .minus { color: var(--del); margin-left: 6px; }
.tool-body { display: none; border-top: 1px solid var(--border); }
.tool.open .tool-body { display: block; }
.term { margin: 0; padding: 10px 14px; font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; overflow-x: auto; }
.term .cmd { color: var(--text); }
.term .cmd::before { content: "$ "; color: var(--rec); }
.term .out { color: var(--muted); }
.term .cmd-plain { color: var(--text); }
.tool.error .term .out { color: var(--del); }
.clip { max-height: 320px; overflow: hidden; position: relative; }
.clip.cut::after { content: ""; position: absolute; inset: auto 0 0 0; height: 48px; background: linear-gradient(transparent, var(--surface)); pointer-events: none; }
.more { display: block; width: 100%; border: 0; border-top: 1px solid var(--border); background: none; color: var(--muted); font: 12px/1 var(--mono); padding: 9px; cursor: pointer; border-radius: 0 0 8px 8px; }
.more[hidden] { display: none; }
.more:hover { color: var(--text); background: var(--surface-2); }
.diff { margin: 0; font: 12.5px/1.55 var(--mono); overflow-x: auto; padding: 6px 0; }
.diff div { padding: 0 14px 0 30px; white-space: pre-wrap; word-break: break-word; position: relative; min-height: 1.55em; }
.diff div::before { position: absolute; left: 12px; color: var(--faint); }
.diff .a { background: var(--add-bg); }
.diff .a::before { content: "+"; color: var(--add); }
.diff .d { background: var(--del-bg); }
.diff .d::before { content: "−"; color: var(--del); }
.diff .s { color: var(--faint); font-style: italic; padding-top: 2px; padding-bottom: 2px; }
.plan { list-style: none; margin: 0; padding: 10px 14px; }
.plan li { padding: 2px 0 2px 24px; position: relative; }
.plan li::before { content: "○"; position: absolute; left: 2px; color: var(--faint); }
.plan li.completed { color: var(--muted); text-decoration: line-through; }
.plan li.completed::before { content: "✓"; color: var(--add); text-decoration: none; }
.plan li.in_progress::before { content: "◐"; color: var(--rec); }

/* Controls */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); }
.bar .wrap { display: flex; align-items: center; gap: 14px; height: 64px; }
.ctl { flex: none; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; height: 36px; min-width: 36px; padding: 0 12px; font: 600 12px/1 var(--mono); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.ctl:hover { border-color: var(--faint); }
.ctl.play { width: 44px; height: 44px; padding: 0; background: var(--text); color: var(--bg); border-color: var(--text); }
.ctl svg { width: 16px; height: 16px; fill: currentColor; }
.track { flex: 1; height: 44px; position: relative; cursor: pointer; touch-action: none; min-width: 60px; }
.rail { position: absolute; left: 0; right: 0; top: 20px; height: 4px; border-radius: 2px; background: var(--border); }
.fill { position: absolute; left: 0; top: 20px; height: 4px; border-radius: 2px; background: var(--text); width: 0; }
.tick { position: absolute; top: 15px; width: 2px; height: 14px; border-radius: 1px; background: var(--faint); opacity: 0.55; pointer-events: none; }
.tick.p { background: var(--text); opacity: 1; top: 11px; height: 22px; }
.tick.e { background: var(--add); opacity: 0.8; }
.tick.x { background: var(--del); opacity: 0.9; }
.head { position: absolute; top: 14px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 0 4px color-mix(in srgb, var(--rec) 25%, transparent); left: 0; pointer-events: none; }
.tip { position: absolute; bottom: 46px; transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--border); color: var(--text); font: 12px/1.3 var(--mono); padding: 6px 9px; border-radius: 6px; white-space: nowrap; max-width: 320px; overflow: hidden; text-overflow: ellipsis; pointer-events: none; display: none; }
.pos { flex: none; font: 12px/1 var(--mono); color: var(--muted); min-width: 64px; text-align: right; }
.follow { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); z-index: 11; display: none; }
.foot { color: var(--faint); font-size: 12px; text-align: center; padding: 40px 0 0; }
.foot a { color: var(--muted); }
@media (max-width: 640px) {
  body { font-size: 14.5px; }
  .wrap { padding: 0 16px; }
  .ev .anchor { display: none; }
  .bar .wrap { gap: 8px; }
  .pos, .ctl.end { display: none; }
  .kind { width: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .dot, .caret::after, .status.run::before { animation: none !important; }
}
</style>

<body>
<div class="wrap">
  <div class="top"><a href="https://github.com/tojacob03/agentvcr" target="_blank" rel="noopener"><span class="dot"></span>AGENTVCR</a></div>
  <header class="poster" id="poster"></header>
  <main id="feed"></main>
  <footer class="foot">Recorded with <a href="https://github.com/tojacob03/agentvcr" target="_blank" rel="noopener">agentvcr</a>. Secrets were redacted before export.</footer>
</div>
<button class="btn follow" id="follow" type="button">↓ Follow</button>
<div class="bar" role="toolbar" aria-label="Playback">
  <div class="wrap">
    <button class="ctl play" id="play" type="button" aria-label="Play (space)"></button>
    <div class="track" id="track" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0">
      <div class="rail"></div><div class="fill" id="fill"></div><div id="ticks"></div><div class="head" id="head"></div><div class="tip" id="tip"></div>
    </div>
    <span class="pos" id="pos"></span>
    <button class="ctl" id="speed" type="button" aria-label="Playback speed">2×</button>
    <button class="ctl end" id="end" type="button" aria-label="Show everything (End)">Show all</button>
  </div>
</div>
<script type="application/json" id="agentvcr-data">__DATA__</script>
<script>
(() => {
  const S = JSON.parse(document.getElementById('agentvcr-data').textContent);
  const $ = (id) => document.getElementById(id);
  const h = (tag, cls, text) => { const el = document.createElement(tag); if (cls) el.className = cls; if (text != null) el.textContent = text; return el; };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';

  // ---------- Markdown (escape first, then a small safe subset) ----------
  function inline(s) {
    const codes = [];
    s = s.replace(/`([^`\n]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    s = esc(s)
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, '$1<em>$2</em>')
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener nofollow">$1</a>');
    return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + esc(codes[+i]) + '</code>');
  }
  function markdown(src) {
    const lines = String(src).replace(/\r/g, '').split('\n');
    let out = '';
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      const fence = line.match(/^\s*(```|~~~)/);
      if (fence) {
        const buf = [];
        i++;
        while (i < lines.length && !lines[i].trim().startsWith(fence[1])) buf.push(lines[i++]);
        i++;
        out += '<pre><code>' + esc(buf.join('\n')) + '</code></pre>';
        continue;
      }
      if (/^\s*$/.test(line)) { i++; continue; }
      const hd = line.match(/^(#{1,6})\s+(.*)$/);
      if (hd) { const n = Math.min(5, hd[1].length + 2); out += `<h${n}>${inline(hd[2])}</h${n}>`; i++; continue; }
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
        const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
        let t = '<table><thead><tr>' + cells(line).map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
        i += 2;
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) t += '<tr>' + cells(lines[i++]).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>';
        out += t + '</tbody></table>';
        continue;
      }
      if (/^\s*>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
        out += '<blockquote>' + inline(buf.join(' ')) + '</blockquote>';
        continue;
      }
      const li = line.match(/^\s*([-*+]|\d+[.)])\s+/);
      if (li) {
        const ordered = /\d/.test(li[1]);
        let items = '';
        while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
          let item = lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) item += ' ' + lines[i++].trim();
          items += '<li>' + inline(item) + '</li>';
        }
        out += ordered ? '<ol>' + items + '</ol>' : '<ul>' + items + '</ul>';
        continue;
      }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !/^\s*(```|~~~|#{1,6}\s|>|([-*+]|\d+[.)])\s)/.test(lines[i]) && !/^\s*\|.*\|\s*$/.test(lines[i])) buf.push(lines[i++]);
      if (!buf.length) buf.push(lines[i++]);
      out += '<p>' + buf.map(inline).join('<br>') + '</p>';
    }
    return out;
  }

  // ---------- Formatting ----------
  function dur(ms) {
    if (!ms || ms < 0) return '0m';
    const m = Math.round(ms / 60000);
    if (m < 1) return Math.max(1, Math.round(ms / 1000)) + 's';
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  }
  const num = (n) => Number(n || 0).toLocaleString('en-US');

  // ---------- Poster ----------
  const st = S.stats || {};
  const poster = $('poster');
  const date = S.startedAt ? new Date(S.startedAt) : null;
  poster.innerHTML =
    `<div class="agent"><b>${esc(S.agent)}</b>${S.model ? '<span>·</span><span>' + esc(S.model) + '</span>' : ''}</div>` +
    `<h1>${esc(S.title)}</h1>` +
    '<div class="meta">' +
      (date ? `<span>${esc(date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' }))}</span>` : '') +
      (S.project ? `<span>${esc(S.project)}</span>` : '') +
      (S.branch && S.branch !== 'HEAD' ? `<span>⎇ ${esc(S.branch)}</span>` : '') +
    '</div>' +
    '<div class="stats">' +
      `<div class="stat"><b>${dur(st.activeMs)}</b><span>active time</span></div>` +
      `<div class="stat"><b>${num(st.prompts)}</b><span>prompts</span></div>` +
      `<div class="stat"><b>${num(st.tools)}</b><span>tool calls</span></div>` +
      `<div class="stat"><b>${num(st.files)}</b><span>files changed</span></div>` +
      `<div class="stat"><b><span class="plus">+${num(st.added)}</span> <span class="minus">−${num(st.removed)}</span></b><span>lines</span></div>` +
    '</div>' +
    '<div class="start"><button class="btn primary" id="go" type="button">' + ICON_PLAY.replace('<svg', '<svg width="14" height="14" fill="currentColor"') + ' Play replay</button><button class="btn" id="readall" type="button">Read transcript</button></div>';

  // ---------- Events ----------
  const KIND = { shell: 'shell', edit: 'edit', write: 'write', read: 'read', search: 'search', web: 'web', task: 'agent', plan: 'plan', mcp: 'mcp', other: 'tool' };
  const OPEN = { shell: 1, edit: 1, write: 1, plan: 1, task: 1 };
  const feed = $('feed');
  const items = S.events.map((e, i) => build(e, i));

  function lines(s) { return s ? s.split('\n').length : 0; }

  function build(e, i) {
    const el = h('section', 'ev');
    el.id = 'e' + i;
    el.hidden = true;
    const a = h('a', 'anchor', '#' + i);
    a.href = '#' + i;
    el.append(a);
    let dur = 0.5;
    let apply = () => {};

    if (e.type === 'prompt') {
      const box = h('div', 'prompt');
      box.append(h('div', 'who', 'You'));
      const body = h('div', 'body');
      box.append(body);
      el.append(box);
      dur = clamp(e.text.length / 55, 0.8, 2.6);
      apply = (p) => {
        body.textContent = p >= 1 ? e.text : e.text.slice(0, Math.ceil(e.text.length * p));
        body.classList.toggle('caret', p < 1);
      };
    } else if (e.type === 'text' || e.type === 'thinking') {
      const r = h('div', 'reveal');
      const inner = h('div', e.type === 'text' ? 'text' : 'thinking');
      if (e.type === 'text') inner.innerHTML = markdown(e.text); else inner.textContent = e.text;
      r.append(inner);
      el.append(r);
      dur = e.type === 'text' ? clamp(e.text.length / 160, 0.6, 4.5) : 0.6;
      apply = (p) => reveal(r, p);
    } else if (e.type === 'note') {
      el.append(h('div', 'note', '— ' + e.text + ' —'));
      dur = 0.4;
      apply = () => {};
    } else if (e.type === 'tool') {
      const t = h('div', 'tool' + (e.error ? ' error' : '') + (OPEN[e.kind] ? ' open' : ''));
      const head = h('div', 'tool-head');
      head.tabIndex = 0;
      head.setAttribute('role', 'button');
      head.append(h('span', 'kind', KIND[e.kind] || 'tool'));
      head.append(h('span', 'tool-title', e.title || e.name));
      const d = e.detail || {};
      if (e.kind === 'edit' || e.kind === 'write') {
        const c = h('span', 'counts');
        c.innerHTML = `<span class="plus">+${d.added || 0}</span><span class="minus">−${d.removed || 0}</span>`;
        head.append(c);
      }
      const status = h('span', 'status');
      head.append(status);
      const toggle = () => { t.classList.toggle('open'); measureClips(t); };
      head.addEventListener('click', toggle);
      head.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } });
      t.append(head);

      const body = h('div', 'tool-body');
      const r = h('div', 'reveal');
      body.append(r);
      let cmdEl = null;
      if (e.kind === 'shell') {
        const pre = h('pre', 'term');
        cmdEl = h('span', 'cmd');
        pre.append(cmdEl);
        if (e.output) pre.append('\n', h('span', 'out', e.output));
        r.append(clip(pre, body));
      } else if (e.kind === 'edit' || e.kind === 'write') {
        const pre = h('div', 'diff');
        for (const [op, line] of d.diff || []) pre.append(h('div', op === '+' ? 'a' : op === '-' ? 'd' : op === '…' ? 's' : '', op === '…' ? '⋯ ' + line : line));
        if (e.error && e.output) pre.append(h('div', 'd', e.output));
        r.append(clip(pre, body));
      } else if (e.kind === 'plan') {
        const ul = h('ul', 'plan');
        for (const it of d.items || []) ul.append(h('li', it.status, it.text));
        r.append(ul);
      } else {
        const pre = h('pre', 'term');
        const parts = [d.input, d.prompt, d.query && 'query: ' + d.query, d.url, d.pattern && 'pattern: ' + d.pattern].filter(Boolean);
        if (parts.length) pre.append(h('span', 'cmd-plain', parts.join('\n')), '\n');
        if (e.output) pre.append(h('span', 'out', e.output));
        r.append(clip(pre, body));
      }
      t.append(body);
      el.append(t);
      const outLines = lines(e.output) + (d.diff ? d.diff.length : 0);
      dur = 0.7 + Math.min(outLines * 0.025, 1.4);
      const cmd = d.command || '';
      apply = (p) => {
        status.className = 'status ' + (p < 1 ? 'run' : e.error ? 'err' : 'ok');
        status.textContent = p < 1 ? '' : e.error ? '✕' : '✓';
        if (cmdEl) {
          const q = clamp(p / 0.4, 0, 1);
          cmdEl.textContent = q >= 1 ? cmd : cmd.slice(0, Math.ceil(cmd.length * q));
        }
        reveal(r, cmdEl ? clamp((p - 0.25) / 0.75, 0.08, 1) : p);
      };
    }
    feed.append(el);
    return { el, dur, apply, e };
  }

  function clip(node, body) {
    const box = h('div', 'clip');
    box.append(node);
    const more = h('button', 'more', 'Show all');
    more.type = 'button';
    more.hidden = true;
    more.addEventListener('click', () => {
      const open = box.style.maxHeight === 'none';
      box.style.maxHeight = open ? '' : 'none';
      box.classList.toggle('cut', open);
      more.textContent = open ? 'Show all' : 'Show less';
    });
    box._more = more;
    body.append(more);
    return box;
  }

  function reveal(r, p) {
    if (p >= 1) {
      r.style.height = '';
      r.classList.remove('partial');
      return;
    }
    r.classList.add('partial');
    r.style.height = Math.round(r.scrollHeight * p) + 'px';
  }

  // Mark long tool outputs once they are visible and measurable.
  function measureClips(el) {
    for (const box of el.querySelectorAll('.clip')) {
      if (box._measured || !box.offsetParent) continue;
      box._measured = true;
      const cut = box.scrollHeight > box.clientHeight + 4;
      box.classList.toggle('cut', cut);
      box._more.hidden = !cut;
    }
  }

  // ---------- Timeline ----------
  const starts = [];
  let T = 0;
  for (const it of items) { starts.push(T); T += it.dur; }
  const N = items.length;
  let t = 0;
  let playing = false;
  let speed = 2;
  let shown = -1;     // events [0, shown) are fully rendered
  let follow = true;
  let last = 0;

  function indexAt(time) {
    let lo = 0, hi = N - 1, ans = 0;
    while (lo <= hi) { const m = (lo + hi) >> 1; if (starts[m] <= time) { ans = m; lo = m + 1; } else hi = m - 1; }
    return ans;
  }

  function render() {
    if (!N) return;
    if (t <= 0 && !playing) {
      // Before the first play only the poster shows.
      for (const it of items) it.el.hidden = true;
      shown = 0;
      bar(0);
      return;
    }
    const idx = t >= T ? N : indexAt(t);
    if (idx < shown) for (let i = idx; i < Math.min(shown + 1, N); i++) items[i].el.hidden = true;
    for (let i = Math.max(0, Math.min(shown, idx)); i < idx; i++) {
      items[i].el.hidden = false;
      items[i].apply(1);
      measureClips(items[i].el);
    }
    let count = idx;
    if (idx < N) {
      const it = items[idx];
      const p = clamp((t - starts[idx]) / it.dur, 0, 1);
      // Paused exactly on a boundary: the next event has not started yet.
      it.el.hidden = p <= 0 && !playing;
      if (!it.el.hidden) { it.apply(p); count++; }
      for (let i = idx + 1; i < N && !items[i].el.hidden; i++) items[i].el.hidden = true;
    }
    shown = idx;
    bar(count);
    if (follow && playing) window.scrollTo(0, document.documentElement.scrollHeight);
  }

  function bar(count) {
    const frac = T ? t / T : 0;
    $('fill').style.width = frac * 100 + '%';
    $('head').style.left = frac * 100 + '%';
    $('pos').textContent = count + ' / ' + N;
    $('track').setAttribute('aria-valuenow', String(Math.round(frac * 100)));
  }

  function frame(now) {
    if (!playing) return;
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    t = Math.min(T, t + dt * speed);
    render();
    if (t >= T) { setPlaying(false); return; }
    requestAnimationFrame(frame);
  }

  function setPlaying(on) {
    if (on && t >= T) { t = 0; shown = N; render(); }
    playing = on;
    document.body.classList.toggle('playing', on);
    $('play').innerHTML = on ? ICON_PAUSE : ICON_PLAY;
    $('play').setAttribute('aria-label', on ? 'Pause (space)' : 'Play (space)');
    if (on) { follow = true; $('follow').style.display = 'none'; last = performance.now(); requestAnimationFrame(frame); }
  }

  function seek(time, stop) {
    t = clamp(time, 0, T);
    if (stop) setPlaying(false);
    render();
  }

  function jumpTo(i) {
    i = clamp(i, 0, N - 1);
    seek(starts[i] + items[i].dur, true);
    items[i].el.scrollIntoView({ block: 'center' });
  }

  // Scrubber ticks: prompts tall, edits green, errors red.
  const ticks = $('ticks');
  const frag = document.createDocumentFragment();
  items.forEach((it, i) => {
    const e = it.e;
    if (e.type !== 'prompt' && e.type !== 'tool') return;
    const k = h('div', 'tick' + (e.type === 'prompt' ? ' p' : e.error ? ' x' : e.kind === 'edit' || e.kind === 'write' ? ' e' : ''));
    k.style.left = (T ? starts[i] / T : 0) * 100 + '%';
    frag.append(k);
  });
  ticks.append(frag);

  const track = $('track');
  const tip = $('tip');
  const timeAt = (x) => { const r = track.getBoundingClientRect(); return clamp((x - r.left) / r.width, 0, 1) * T; };
  let dragging = false;
  track.addEventListener('pointerdown', (ev) => {
    dragging = true;
    seek(timeAt(ev.clientX), true);
    try { track.setPointerCapture(ev.pointerId); } catch { /* synthetic pointers */ }
  });
  track.addEventListener('pointermove', (ev) => {
    const time = timeAt(ev.clientX);
    if (dragging) seek(time, true);
    const it = items[indexAt(time)];
    if (!it) return;
    const e = it.e;
    tip.textContent = e.type === 'prompt' ? 'You: ' + e.text.split('\n')[0] : e.type === 'tool' ? (KIND[e.kind] || 'tool') + ' · ' + (e.title || e.name) : e.type === 'text' ? e.text.split('\n')[0] : e.text || e.type;
    tip.style.display = 'block';
    const r = track.getBoundingClientRect();
    tip.style.left = clamp(ev.clientX - r.left, 80, r.width - 80) + 'px';
  });
  track.addEventListener('pointerup', () => {
    dragging = false;
    // Land the reader on the moment they scrubbed to.
    const it = items[Math.min(shown, N - 1)];
    if (it && t < T) it.el.scrollIntoView({ block: 'end' });
  });
  track.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
  track.addEventListener('keydown', (ev) => {
    if (ev.key === 'ArrowRight') { ev.preventDefault(); jumpTo(Math.min(shown, N - 1) + 1); }
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); jumpTo(Math.min(shown, N) - 2); }
  });

  const SPEEDS = [1, 2, 4, 8, 16];
  $('speed').addEventListener('click', () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; $('speed').textContent = speed + '×'; });
  $('play').addEventListener('click', () => setPlaying(!playing));
  $('end').addEventListener('click', () => { seek(T, true); });
  $('go').addEventListener('click', () => { seek(0, true); setPlaying(true); });
  $('readall').addEventListener('click', () => { seek(T, true); items[0] && items[0].el.scrollIntoView({ block: 'start' }); });
  $('follow').addEventListener('click', () => { follow = true; $('follow').style.display = 'none'; window.scrollTo(0, document.documentElement.scrollHeight); });

  // Scrolling up while playing stops auto-follow until the reader asks for it again.
  const unfollow = () => { if (playing && follow) { follow = false; $('follow').style.display = 'inline-flex'; } };
  window.addEventListener('wheel', (ev) => { if (ev.deltaY < 0) unfollow(); }, { passive: true });
  window.addEventListener('touchmove', unfollow, { passive: true });

  document.addEventListener('keydown', (ev) => {
    if (ev.target.closest && ev.target.closest('input, textarea, [contenteditable]')) return;
    if (ev.key === ' ' && !ev.target.closest('button, [role="button"]')) { ev.preventDefault(); setPlaying(!playing); }
    else if (ev.key === 'End') { ev.preventDefault(); seek(T, true); }
    else if (ev.key === 'Home') { ev.preventDefault(); seek(0, true); window.scrollTo(0, 0); }
    else if (ev.key === 'ArrowRight' && ev.target === document.body) jumpTo(Math.min(shown, N - 1) + 1);
    else if (ev.key === 'ArrowLeft' && ev.target === document.body) jumpTo(Math.min(shown, N) - 2);
    else if (/^[1-5]$/.test(ev.key)) { speed = SPEEDS[+ev.key - 1]; $('speed').textContent = speed + '×'; }
  });

  // #42 links to the moment right after event 42.
  function fromHash() {
    const m = location.hash.match(/^#(\d+)$/);
    if (m && +m[1] < N) { jumpTo(+m[1]); return true; }
    return false;
  }
  window.addEventListener('hashchange', fromHash);
  $('play').innerHTML = ICON_PLAY;
  if (!fromHash()) {
    if (/[?&]autoplay\b/.test(location.search)) setPlaying(true);
    else render();
  }
})();
</script>
</body>
</html>
